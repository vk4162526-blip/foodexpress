<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodExpress Admin</title><style>body{font:16px system-ui;background:#fff8f2;color:#222}.wrap{max-width:1000px;margin:25px auto;padding:0 14px}h1{color:#e64a19}.panel,.order{background:white;padding:16px;margin:12px 0;border:1px solid #eee;border-radius:12px}input{padding:10px;width:min(400px,95%);margin:8px 0;display:block}button,select{padding:9px;border-radius:7px;border:0;background:#f4511e;color:white;font-weight:bold}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.err{color:#a20}</style></head><body><div class="wrap"><h1>🍔 FoodExpress — एडमिन पैनल</h1><section id="loginbox" class="panel"><h2>एडमिन लॉगिन</h2><form id="login"><input name="password" type="password" placeholder="ADMIN_PASSWORD" required><button>लॉगिन</button></form><p id="err" class="err"></p></section><section id="dash" hidden><button id="refresh">रिफ्रेश</button> <button id="logout">लॉगआउट</button><p id="msg"></p><div id="orders"></div></section></div><script>
let token='';const $=x=>document.getElementById(x),money=n=>'₹'+Number(n).toLocaleString('en-IN'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('login').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:new FormData(e.target).get('password')})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;$('loginbox').hidden=true;$('dash').hidden=false;load()}catch(x){$('err').textContent=x.message}};
async function load(){try{let r=await fetch('/api/admin/orders',{headers:{'x-admin-token':token}}),a=await r.json();if(!r.ok)throw Error(a.error);$('msg').textContent='कुल ऑर्डर: '+a.length;$('orders').innerHTML=a.length?a.map(o=>`<article class="order"><div class="orderhead"><h3>${esc(o.code)} · ${esc(o.name)}</h3><b>${money(o.total)}</b></div><p>मोबाइल: ${esc(o.phone)}<br>पता: ${esc(o.address)}<br>समय: ${new Date(o.created).toLocaleString('hi-IN')}</p><p>${o.items.map(i=>`${esc(i.name)} × ${i.quantity} — ${money(i.unitPrice*i.quantity)}`).join('<br>')}</p><p>पेमेंट: ${esc(o.payment)}</p><label>स्टेटस: <select data-id="${o.id}">${['Received','Preparing','Out for delivery','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></label></article>`).join(''):'<p>अभी कोई ऑर्डर नहीं है।</p>'}catch(e){$('msg').textContent=e.message}}
$('orders').onchange=async e=>{let s=e.target.closest('[data-id]');if(!s)return;let r=await fetch('/api/admin/orders/'+s.dataset.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({status:s.value})});let d=await r.json();$('msg').textContent=r.ok?'स्टेटस अपडेट हो गया।':d.error};$('refresh').onclick=load;$('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST',headers:{'x-admin-token':token}});token='';$('dash').hidden=true;$('loginbox').hidden=false};
</script></body></html>
